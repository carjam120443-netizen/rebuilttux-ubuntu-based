name: Build RebuiltTux ISO

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y debootstrap squashfs-tools grub-pc-bin grub-efi-amd64-bin grub-imageboot xorriso mtools
      - name: Build ISO
        run: sudo ./build/build.sh
      - name: Upload ISO
        uses: actions/upload-artifact@v4
        with:
          name: rebuilttux-iso
          path: output/*.iso
          if-no-files-found: error

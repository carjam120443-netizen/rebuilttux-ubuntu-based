name: Build RebuiltTux ISO

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y debootstrap squashfs-tools grub-pc-bin grub-efi-amd64-bin grub-efi-amd64-signed shim-signed xorriso mtools

      - name: Verify build files
        run: |
          pwd
          ls -la
          ls -la build
          test -f build/build.sh

      - name: Build ISO
        run: sudo bash build/build.sh

      - name: Upload ISO
        uses: actions/upload-artifact@v4
        with:
          name: rebuilttux-iso
          path: output/*.iso
          if-no-files-found: error
